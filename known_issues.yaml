- id: issue.abox_armor_stores_shield
  title_zh: ABox armor 字段实际保存 shield
  issue_type: implementation_quirk
  severity: high
  truth_status: code_reality
  status: open
  phenomenon: ABox 的 armor/armor_ratio 由 shield/shield_ratio 赋值。
  concise_explanation: 字段名称表达护甲，但当前数值语义是护盾。
  expected_or_documented_behavior: armor 应保存护甲；若保存护盾应采用 shield 语义。
  current_implementation: 创建和更新 ABox 时均使用 shield 映射。
  affected_variable_ids:
  - abox.unit.armor
  - abox.unit.armor_ratio
  - raw_unit.shield
  - raw_unit.shield_ratio
  affected_noncanonical_fields: []
  evidence:
  - path: ontology/bridge.py
    symbol: BattlefieldGraph._add_unit_instance
    line_start: 201
    line_end: 202
    claim: 创建路径把 shield 写入 armor。
  - path: ontology/bridge.py
    symbol: BattlefieldGraph._update_unit_instance
    line_start: 264
    line_end: 269
    claim: 更新路径沿用同一映射。
  impact:
    knowledge_answer_constraint: 必须说明当前 ABox armor 实际是 shield，不能解释为 SC2 护甲。
    code_or_experiment_risk: 论文或代码可能错误解释物理量。
  recommended_verification:
    method: static_unit_test
    execution_status: not_executed
    steps:
    - 构造 shield 非零的 raw_unit。
    - 检查 ABox 创建和更新结果。
    success_criteria: 字段命名、文档语义和数据源一致。
  limitations:
  - 未启动 SC2。
