- id: issue.swm_error_uses_future_state_as_baseline
  title_zh: SWM health/position 误差基线错误
  issue_type: confirmed_bug
  severity: critical
  truth_status: code_reality
  status: open
  phenomenon: 误差函数用 actual(t+1) 同时构造预测值和真实值。
  concise_explanation: health 误差退化为 delta²，position 误差退化为预测位移模长。
  expected_or_documented_behavior: 预测绝对值应由 t 状态加 delta，再与 t+1 真值比较。
  current_implementation: 函数没有接收 t 时刻单位基线。
  affected_variable_ids:
  - metric.swm.health_rmse
  - metric.swm.overall_error
  - metric.swm.position_rmse
  affected_noncanonical_fields: []
  evidence:
  - path: ontology/swm_predictor.py
    symbol: SWMPredictor.compute_prediction_error
    line_start: 272
    line_end: 282
    claim: health 与 position 都从 actual_state 构造预测值。
  - path: agents/raw_agent.py
    symbol: RawAgent._record_swm_ground_truth
    line_start: 285
    line_end: 292
    claim: 训练器记录下一帧快照。
  impact:
    knowledge_answer_constraint: 不得称这些值为严格未来状态 RMSE；须提示基线缺陷及其传播到 overall_error。
    code_or_experiment_risk: 实验指标可能无法反映真实预测误差。
  recommended_verification:
    method: static_unit_test
    execution_status: not_executed
    steps:
    - 构造 t、delta、t+1 的已知样例。
    - 手算并回归三个指标。
    success_criteria: 误差等于预测未来绝对状态与 t+1 真值之差。
  limitations:
  - 未重跑历史实验。
- id: issue.swm_relation_accuracy_is_prediction_precision
  title_zh: relation_accuracy 更接近预测关系命中率
  issue_type: implementation_quirk
  severity: high
  truth_status: code_reality
  status: open
  phenomenon: 指标只以预测关系为分母；不惩罚漏报，空预测返回 1.0，当前真值快照 relations 为空。
  concise_explanation: 它不等同于覆盖假阴性的完整关系准确率。
  expected_or_documented_behavior: 应明确 precision/recall/F1 或定义空集合与漏报规则。
  current_implementation: 实现遍历 predicted_relations；无预测时保留 1.0。
  affected_variable_ids:
  - metric.swm.overall_error
  - metric.swm.relation_accuracy
  affected_noncanonical_fields: []
  evidence:
  - path: ontology/swm_predictor.py
    symbol: SWMPredictor.compute_prediction_error
    line_start: 291
    line_end: 309
    claim: 只用预测关系作分母且空预测为 1.0。
  - path: agents/raw_agent.py
    symbol: RawAgent._record_swm_ground_truth
    line_start: 290
    line_end: 290
    claim: 当前下一帧关系真值为空。
  impact:
    knowledge_answer_constraint: 应称预测关系命中比例，并披露空预测=1.0与当前真值为空。
    code_or_experiment_risk: overall_error 可能偏乐观。
  recommended_verification:
    method: static_unit_test
    execution_status: not_executed
    steps:
    - 构造命中、误报、漏报和空预测案例。
    - 比较 precision/recall/F1。
    success_criteria: 指标名、公式和空集合规则一致。
  limitations:
  - 未重跑 SWM 实验。
