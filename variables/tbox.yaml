      known_values:
        Marine: Basic Terran infantry. High fire rate with low per-shot damage. Vulnerable with only 45 HP, easily eliminated
          by area damage. Low cost enables rapid production and numerical superiority. Effective against melee units (Zergling)
          due to range advantage, but struggles against high-armor units (Roach).
        SCV: Terran worker unit. Can gather minerals and gas, construct buildings, and repair mechanical units. Vulnerable
          with only 45 HP and no armor. Low cost allows for rapid production, but should be protected from enemy attacks.
          Essential for economy and infrastructure development.
        Zergling: Cheapest Zerg melee unit with high mobility for flanking and harassment. Low HP without armor makes it vulnerable
          to ranged fire suppression.
        Roach: Zerg medium ground unit with high HP (145) and armor, effectively resists low-damage weapons. Strong attack
          power with slow fire rate, excels against high-HP units.
        Reaper: Highly mobile Terran scout/skirmisher. Cliff-jumping ability and KD8 charge enable hit-and-run tactics. Effective
          against light units, weak against heavy armor.
        Marauder: Terran heavy infantry with concussive shells (slows armored). Excellent vs Roach/Stalker/Immortal. Vulnerable
          to massed light units.
        SiegeTank: Terran heavy mech. Siege Mode unlocks splash damage at 13 range, devastating massed armies. Vulnerable
          to flanks while sieged.
        Medivac: Terran flying medic / dropship. Heals biological units (12.6 HP/s) and transports infantry (8 cargo). Cannot
          attack.
        Hellion: Fast Terran light vehicle. Linear flame attack (+5 vs Light) excels against workers and light infantry. Fragile
          vs heavy fire.
        Banshee: Terran cloakable air-to-ground gunship. High burst DPS against ground; cannot attack air. Cloaking enables
          harassment.
        Baneling: Zerg suicide AOE unit (morphed from Zergling). Single-shot 20 splash damage (+15 vs Light) devastates clumped
          Marines/Zerglings. Dies on use.
        Hydralisk: Zerg ranged unit firing both ground and air. High DPS but fragile (90 HP, 0 armor). Backbone vs Marines
          and air harass.
        Mutalisk: Zerg mobile flying unit with bouncing glaive attack (3 targets). Excels at harass / map control. Weak vs
          Marine massed AA.
        Overlord: Zerg supply provider and basic detector (after upgrade). Slow flying unit, vital for population cap. Cannot
          attack.
        Drone: Zerg worker. Gathers minerals/gas and morphs into structures (consumed). Essential for economy.
        Barracks: Terran barracks for infantry production. Requires SupplyDepot prerequisite. Produces Marine, Reaper, Marauder
          and other infantry units.
        SupplyDepot: Terran supply structure providing 8 population capacity. Can raise/lower to block ground unit passage
          when lowered.
        CommandCenter: Terran main base building. Produces SCV workers and provides 11 population capacity. Upgradable to
          Planetary_Fortress or Orbital_Command.
        Mineral: Mineral crystals, primary resource for constructing all buildings and units. Harvested by SCV workers.
        VespeneGas: Vespene gas, advanced resource for tech upgrades and advanced units. Requires Refinery construction for
          SCV harvesting.
        Supply: Population supply limiting maximum unit count. Provided by Supply_Depot and Command_Center structures.
        Beacon: Score resource used for tracking minigame performance. Accumulated based on actions taken and objectives achieved
          during the episode.
