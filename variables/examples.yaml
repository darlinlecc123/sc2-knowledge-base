- schema_version: 1.0.0
  id: derived.tactical.engagement_type
  canonical_name: Engagement_Type
  names:
    zh: 交战距离类型
    en: Engagement Type
    code: Engagement_Type
  category: derived_tactical_state
  aliases:
  - 交战类型
  - 接战距离
  - 敌我距离档位
  - Engagement_Type
  - Close-Combat Medium-Range Long-Range
  definition: STORM 根据友军与敌军 ABox 单位位置质心之间的欧氏距离，通过两个阈值生成的战术分类标签。
  intuitive_explanation: 先找我方部队中心和敌方部队中心，再看两个中心离多远：小于 10 算近战，小于 20 算中距离，否则算远距离。
  interface:
    data_type: string
    python_type: str
    shape:
      kind: scalar
      dimensions: []
      description: 战术摘要中的单个字符串标签；仅敌我双方均有单位时生成。
    unit:
      value: null
      status: not_applicable
      note: 分类标签本身无单位。
    dimension:
      value: categorical
      status: known
      note: 类别量。
    range:
      status: not_applicable
      minimum: null
      maximum: null
      minimum_inclusive: null
      maximum_inclusive: null
      description: 字符串枚举不使用数值范围。
    enum_values:
      status: known
      values:
      - Close-Combat
      - Medium-Range
      - Long-Range
      description: 当前代码可生成的三个精确字符串。
    nullable: false
    pysc2_path:
      value: null
      status: not_applicable
      note: 由 ABox 位置运行时派生，不是 PySC2 原始字段。
    storm_paths:
    - 'BattlefieldGraph.generate_tactical_summary output: Engagement_Type'
  provenance:
    source_layer: derived_runtime
    derivation_kind: computed
    upstream_variable_ids:
    - abox.unit.position.x
    - abox.unit.position.y
    - abox.unit.alliance
  implementation:
    source_locations:
    - path: ontology/bridge.py
      symbol: BattlefieldGraph.generate_tactical_summary
      line_start: 909
      line_end: 991
    extraction_code:
    - 'friendly units: alliance == 1'
    - 'enemy units: alliance == 4'
    - missing position x/y defaults to 0
    transformation_formula:
    - friendly_centroid = mean(friendly positions)
    - enemy_centroid = mean(enemy positions)
    - d = euclidean_distance(friendly_centroid, enemy_centroid)
    - Close-Combat if d < 10; Medium-Range if 10 <= d < 20; Long-Range if d >= 20
  consumers:
  - name: LLM tactical prompt context
    path: ontology/bridge.py
    symbol: BattlefieldGraph.generate_tactical_summary
    purpose: 作为战术摘要文本，帮助决策模型理解敌我接战尺度。
  lifecycle:
    update_timing: 每次调用 generate_tactical_summary 且敌我双方均非空时重新计算。
    scope: per_decision
    persistence: 作为摘要字符串临时生成，不是 PySC2 持久状态。
  examples:
  - scenario: 质心距离恰好为 10
    input:
      center_distance: 10
    output: Medium-Range
    explanation: 第一分支使用 d < 10。
  - scenario: 质心距离恰好为 20
    input:
      center_distance: 20
    output: Long-Range
    explanation: 第二分支使用 d < 20。
  relationships:
  - relation: derived_from
    target_id: abox.unit.position
    description: 由敌我单位位置集合的质心距离派生。
  - relation: related_to
    target_id: derived.tactical.formation_distance
    description: 先计算 Formation_Distance，再按阈值形成类别标签。
  design_intent:
  - claim: 摘要被设计为放在 Prompt 开头的全局快速视角，而不是替代详细状态。
    status: design_intent
    evidence_ids:
    - engagement-doc
  code_reality:
  - claim: 当前实现只在敌我双方均非空时计算质心距离，并按 <10、<20、else 输出三个标签。
    status: code_reality
    evidence_ids:
    - engagement-code
  limitations:
  - 质心无法表达包围、分兵或离群单位。
  - 缺失 position/x/y 时代码使用 0，可能影响质心。
  - 距离单位及阈值物理依据尚未核验。
  - 敌我任一方为空时不会出现 Engagement_Type 行。
  known_issues:
  - id: engagement_distance_unit_unknown
    description: center_distance 的接口单位和阈值物理依据未在当前代码中声明。
    status: needs_verification
    evidence_ids:
    - engagement-code
  evidence:
  - id: engagement-code
    path: ontology/bridge.py
    symbol: BattlefieldGraph.generate_tactical_summary
    line_start: 956
    line_end: 982
    evidence_type: E1
    claim: 代码计算敌我位置质心、欧氏距离并按 10/20 阈值分类。
    fact_status: derived_runtime
    verified_at: '2026-09-03'
  - id: engagement-doc
    path: ontology/bridge.py
    symbol: BattlefieldGraph.generate_tactical_summary
    line_start: 909
    line_end: 925
    evidence_type: E5
    claim: docstring 声明战术摘要用于提供全局快速视角。
    fact_status: design_intent
    verified_at: '2026-09-03'
  verification:
    status: static_verified
    verified_at: '2026-09-03'
    sc2_executed: false
    tests_executed:
    - name: current_source_static_inspection
      result: passed
    - name: StarCraft II runtime observation
      result: not_executed
    external_sources_checked: false
    notes: 公式和边界分支已静态核对；未构造 BattlefieldGraph 运行，也未执行 SC2。
- schema_version: 1.0.0
  id: action.delay_steps
  canonical_name: delay_steps
  names:
    zh: 动作延迟步数
    en: Action Delay Steps
    code: delay_steps
  category: action_schema_and_scheduling
  aliases:
  - 延迟执行
  - 未来第几步执行
  - 动作等待步数
  - delay_steps
  - action delay
  definition: LLM 动作记录中的可选调度字段；ResponseParser 将其转换并裁剪到 0–9，RawAgent 用当前 self.steps 加该值确定待执行步骤。
  intuitive_explanation: 0 表示现在做，N 表示先把动作放进计划表，到当前 Agent 步数加 N 时再取出执行。它是 STORM 环境交互步，不是秒。
  interface:
    data_type: integer
    python_type: int
    shape:
      kind: scalar
      dimensions: []
      description: 每条动作记录一个整数。
    unit:
      value: STORM environment step
      status: known
      note: 代码按 self.steps + delay_steps 调度；不直接等同于秒或 SC2 game loop。
    dimension:
      value: step count
      status: known
      note: 离散环境交互步数。
    range:
      status: known
      minimum: 0
      maximum: 9
      minimum_inclusive: true
      maximum_inclusive: true
      description: Parser 负值归零，大于 9 截断为 9。
    enum_values:
      status: not_applicable
      values: []
      description: 整数范围，不逐项维护枚举。
    nullable: false
    pysc2_path:
      value: null
      status: not_applicable
      note: 这是 STORM 的 LLM 动作 Schema/调度字段，不是 PySC2 FunctionCall 原生参数。
    storm_paths:
    - llm_response.actions[*].delay_steps
    - validated_action.delay_steps
    - RawAgent.pending_actions[self.steps + delay_steps]
  provenance:
    source_layer: validated_action
    derivation_kind: validated
    upstream_variable_ids:
    - llm_output.actions.delay_steps
  implementation:
    source_locations:
    - path: ontology/prompt_template.py
      symbol: ACTION_SPACE
      line_start: 17
      line_end: 54
    - path: agents/response_parser.py
      symbol: ResponseParser._validate_schema
      line_start: 165
      line_end: 267
    - path: agents/raw_agent.py
      symbol: RawAgent._convert_actions_to_pysc2
      line_start: 828
      line_end: 1000
    extraction_code:
    - missing delay_steps defaults to 0
    - delay = int(action["delay_steps"])
    transformation_formula:
    - validated_delay = min(9, max(0, int(input_delay)))
    - target_step = self.steps + validated_delay
  consumers:
  - name: ResponseParser
    path: agents/response_parser.py
    symbol: ResponseParser._validate_schema
    purpose: 补默认值、转整数、裁剪范围或返回类型错误。
  - name: RawAgent scheduler
    path: agents/raw_agent.py
    symbol: RawAgent._convert_actions_to_pysc2
    purpose: 决定立即执行，或写入 pending_actions 的未来 Agent 步。
  lifecycle:
    update_timing: 每次解析一条 LLM 动作时校验；每次动作转换时用于一次调度。
    scope: per_action
    persistence: 延迟动作保存在 RawAgent.pending_actions，直到目标 Agent 步被处理。
  examples:
  - scenario: 字段缺失
    input:
      action: MOVE
    output:
      delay_steps: 0
    explanation: Parser 默认补 0。
  - scenario: 输入超出上限
    input:
      delay_steps: 12
    output:
      delay_steps: 9
    explanation: Parser 截断为 9。
  - scenario: 当前 Agent 步为 30，延迟为 4
    input:
      self_steps: 30
      delay_steps: 4
    output:
      target_step: 34
    explanation: 调度键为 self.steps + delay_steps。
  relationships:
  - relation: distinct_from
    target_id: environment.step_mul
    description: step_mul 表示一次环境交互推进多少 game loops；delay_steps 是等待多少次 Agent 环境步。
  - relation: distinct_from
    target_id: agent.decision_interval
    description: decision_interval 控制多久请求一次新决策；delay_steps 控制某条动作何时执行。
  - relation: constrains
    target_id: validated_action.execution_time
    description: 决定动作立即执行还是进入 pending_actions。
  design_intent:
  - claim: Prompt 要求模型为未来 10 个步骤规划，并将 delay_steps 限制为 0–9；0 为立即执行。
    status: design_intent
    evidence_ids:
    - delay-prompt
  code_reality:
  - claim: 缺失值补 0；输入经 int 转换；负值归 0；大于 9 截断为 9；转换失败使解析无效。
    status: code_reality
    evidence_ids:
    - delay-parser
  - claim: 0 立即执行，否则写入 pending_actions[self.steps + delay_steps]。
    status: code_reality
    evidence_ids:
    - delay-scheduler
  limitations:
