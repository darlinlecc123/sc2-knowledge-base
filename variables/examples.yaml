  category: raw_unit
  aliases:
  - 血量比例
  - 生命百分比
  - HP ratio
  - health_ratio
  - 归一化生命值
  definition: STORM 从当前 RawUnit 行的索引 7 读取编码值并除以 255 后生成的无量纲比例字段。
  intuitive_explanation: 它表示单位当前生命状态的相对量，而不是还剩多少点绝对生命值；STORM 用除以 255 的方式把接口编码转换成比例。
  interface:
    data_type: number
    python_type: float
    shape:
      kind: scalar
      dimensions: []
      description: 每个解析后的单位一个标量。
    unit:
      value: '1'
      status: known
      note: 无量纲比例。
    dimension:
      value: dimensionless
      status: known
      note: 比例量，无物理量纲。
    range:
      status: needs_verification
      minimum: 0
      maximum: 1
      minimum_inclusive: true
      maximum_inclusive: true
      description: 按当前除以 255 的实现预期约为 [0,1]；底层字段编码范围尚未用官方资料或运行时观测核验。
    enum_values:
      status: not_applicable
      values: []
      description: 连续数值，不使用枚举。
    nullable: false
    pysc2_path:
      value: obs.observation.raw_units[*][7]
      status: needs_verification
      note: 当前 STORM 的位置索引访问形式；官方字段名和版本语义尚未外部核验。
    storm_paths:
    - parsed_raw_unit.health_ratio
    - abox.hp_ratio
  provenance:
    source_layer: raw_unit_transformed
    derivation_kind: normalized
    upstream_variable_ids:
    - pysc2.raw_unit.index_7
  implementation:
    source_locations:
    - path: agents/raw_agent.py
      symbol: RawAgent.parse_raw_units
      line_start: 334
      line_end: 362
    extraction_code:
    - unit[7]
    transformation_formula:
    - health_ratio = unit[7] / 255
  consumers:
  - name: BattlefieldGraph
    path: ontology/bridge.py
    symbol: BattlefieldGraph.update_from_observation
    purpose: 作为运行时 ABox 单位生命比例的上游输入。
  - name: tactical summary
    path: ontology/bridge.py
    symbol: BattlefieldGraph.generate_tactical_summary
    purpose: 通过 ABox hp_ratio 参与平均血量和低血量判断。
  lifecycle:
    update_timing: 每次 RawAgent.step 收到新 observation 并调用 parse_raw_units 时重新计算。
    scope: per_observation
    persistence: 先存在于当前解析字典中，随后可写入当前 ABox；不是静态常量。
  examples:
