knowledge_base: storm-sc2kb-v1-raw
schema_version: 1.0.0
generated_at: '2026-09-03'
status: query_patterns_built
runtime_boundary:
  external_llm_tested: false
  sc2_executed: false
intent_registry:
- id: interface_query
  name_zh: 接口形式查询
  description: 查询数据类型、Python类型、形状、单位、范围以及PySC2/STORM访问路径
- id: physical_meaning_query
  name_zh: 物理含义查询
  description: 查询变量在SC2或STORM数据流中的含义及其层级边界
- id: source_location_query
  name_zh: 源码定位查询
  description: 查询生产、读取、转换或消费该变量的仓库相对路径与符号
- id: formula_query
  name_zh: 公式查询
  description: 查询归一化、聚合、阈值、映射或统计公式
- id: range_query
  name_zh: 取值范围查询
  description: 查询代码已验证的范围、枚举、单位及未知边界
routing_rules:
- priority: 1
  condition: exact stable variable_id
  action: direct lookup by variable_id
- priority: 2
  condition: one normalized alias candidate
  action: return candidate with evidence and truth boundary
- priority: 3
  condition: multiple normalized alias candidates
  action: return all candidates with taxonomy_source_layer and ask clarification_question
- priority: 4
  condition: common mistake only
  action: show correction; do not invent or silently redirect
- priority: 5
  condition: no current variable candidate
  action: report out_of_scope_or_not_found; do not create a PySC2 field
global_templates:
  interface_query:
  - '{term}的接口形式是什么？'
  - 如何从PySC2或STORM中读取{term}？
  physical_meaning_query:
  - '{term}是什么意思？'
  - '{term}对应什么物理量，属于哪个数据层？'
  source_location_query:
  - '{term}在哪个.py文件实现？'
  - 给出{term}的源码依据和消费者。
  formula_query:
  - '{term}是如何计算的？'
  - '{term}的转换公式和上游变量是什么？'
  range_query:
  - '{term}的范围、单位和枚举是什么？'
  - '{term}哪些取值已由代码确认，哪些仍需验证？'
required_response_fields:
- matched_variable_id
- candidate_variables_if_ambiguous
- taxonomy_source_layer
- answer
- evidence_ids
- source_locations
- truth_boundary
- clarification_question_if_needed
per_variable_patterns:
- variable_id: abox.graph.enemy_count
  preferred_query_terms:
  - ABox 敌军节点计数
  - abox.graph.enemy_count
  - enemy_count
  patterns:
    interface_query:
    - ABox 敌军节点计数的接口形式是什么？
    - enemy_count的数据类型、形状和访问路径是什么？
    physical_meaning_query:
    - ABox 敌军节点计数表示什么物理量？
    - abox.graph.enemy_count在STORM数据流中的含义和层级是什么？
    source_location_query:
    - ABox 敌军节点计数在哪个.py文件中读取或计算？
    - 请给出abox.graph.enemy_count的源码路径、函数和证据行。
    formula_query:
    - ABox 敌军节点计数是怎么计算或转换的？
    - enemy_count有没有归一化、聚合、阈值或映射公式？
    range_query:
    - ABox 敌军节点计数的取值范围和单位是什么？
    - abox.graph.enemy_count有哪些枚举、上下界或尚未确认的范围？
